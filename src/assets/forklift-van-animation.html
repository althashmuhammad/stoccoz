<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forklift loads a van</title>
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:transparent!important;overflow:hidden}
svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 1200 486" preserveAspectRatio="xMidYMax slice" role="img" aria-label="A yellow silhouette forklift lifts a boxed pallet and loads it into a van">
<defs>
  <g id="crate"><rect width="60" height="50" rx="2" stroke="#fff" stroke-width="2"/><rect x="26" width="8" height="50" fill="#fff"/><rect x="8" y="14" width="12" height="9" fill="#fff"/></g>
  <g id="whl"><circle r="26"/><circle r="11" fill="#fff"/><rect x="-2.5" y="-11" width="5" height="22"/><rect x="-11" y="-2.5" width="22" height="5"/></g>
  <g id="pal"><rect y="-14" width="62" height="5"/><rect y="-9" width="9" height="9"/><rect x="26" y="-9" width="10" height="9"/><rect x="53" y="-9" width="9" height="9"/><use href="#crate" x="1" y="-64"/></g>
</defs>
<g id="far"></g>
<g id="mid"></g>
<g id="world" fill="#FFC400">
  <g transform="translate(0,480)">
    <rect x="-600" y="0" width="3600" height="4"/>
    <g id="stock"></g>
    <g transform="translate(30,0)">
      <rect x="900" y="-62" width="492" height="28"/>
      <circle cx="985" cy="-32" r="38" fill="#fff"/><circle cx="1310" cy="-32" r="38" fill="#fff"/>
      <rect x="900" y="-70" width="332" height="8"/>
      <rect x="900" y="-240" width="332" height="9"/>
      <rect x="1222" y="-240" width="10" height="178"/>
      <path d="M1232,-232H1306Q1326,-232 1338,-214L1380,-150Q1392,-134 1392,-116V-34H1232Z"/>
      <path d="M1248,-216H1301Q1314,-216 1322,-203L1348,-162H1248Z" fill="#fff"/>
      <rect x="1388" y="-80" width="10" height="46" rx="3"/>
      <use href="#whl" transform="translate(985,-32) scale(1.3)"/>
      <use href="#whl" transform="translate(1310,-32) scale(1.3)"/>
      <use href="#crate" x="1100" y="-120"/><use href="#crate" x="1160" y="-120"/><use href="#crate" x="1130" y="-170"/>
    </g>
    <use id="pallet" href="#pal" x="0" y="0"/>
    <g id="fk">
      <path d="M0,-26V-80Q0,-90 12,-90H34L40,-76H84L102,-62H122V-26Z"/>
      <path d="M50,-76L52,-112Q56,-120 68,-118L74,-104L92,-88L96,-76Z"/>
      <circle cx="66" cy="-132" r="9"/>
      <rect x="30" y="-158" width="90" height="7" rx="3"/>
      <rect x="36" y="-152" width="6" height="70"/>
      <rect x="108" y="-152" width="6" height="92"/>
      <rect x="122" y="-200" width="6" height="200"/><rect x="130" y="-200" width="6" height="200"/>
      <rect x="122" y="-200" width="14" height="6"/><rect x="122" y="-110" width="14" height="5"/>
      <g id="car"><rect x="126" y="-62" width="10" height="62"/><path d="M126,-6H199L199,-3L190,0H126Z"/></g>
      <g transform="translate(22,-22) scale(.846)"><g id="wr"><use href="#whl"/></g></g>
      <g transform="translate(92,-26)"><g id="wf"><use href="#whl"/></g></g>
    </g>
  </g>
</g>
</svg>
<script>
const $=id=>document.getElementById(id);
function rnd(s){s=Math.sin(s*127.1+311.7)*43758.5453;return s-Math.floor(s)}
function rack(x0,x1,unit,levels,top,gnd,bh,col,seed){
  let s='';
  for(let x=x0,i=0;x<x1;x+=unit,i++){
    s+=`<rect x="${x}" y="${top}" width="8" height="${gnd-top}"/>`;
    levels.forEach((y,j)=>{
      s+=`<rect x="${x}" y="${y}" width="${unit+8}" height="8"/>`;
      let bx=x+14;
      while(bx<x+unit-30){
        const w=unit*(.22+.14*rnd(seed+i*7+j*3+bx));
        if(bx+w>x+unit-6)break;
        if(rnd(seed+bx*.37+j)>.38){const h=bh*(.6+.4*rnd(seed+bx+j*5));s+=`<rect x="${bx}" y="${y-h}" width="${w}" height="${h}" stroke="#fff" stroke-width="2"/>`}
        bx+=w+8+10*rnd(bx);
      }
    });
  }
  return `<g fill="${col}">${s}</g>`;
}
$('far').innerHTML=rack(-400,2400,160,[180,262,344,426],110,470,56,'#FFF0B8',3);
$('mid').innerHTML=rack(-400,2600,230,[250,340,430],190,478,70,'#FFE07A',11);

let st='';
st+=`<use href="#pal" x="400"/>`;
[[400,3],[478,2],[556,3],[634,1]].forEach(([x,n])=>{
  st+=`<rect x="${x}" y="-14" width="62" height="5"/><rect x="${x}" y="-9" width="9" height="9"/><rect x="${x+26}" y="-9" width="10" height="9"/><rect x="${x+53}" y="-9" width="9" height="9"/>`;
  for(let k=0;k<n;k++)st+=`<use href="#crate" x="${x+1}" y="${-14-50*(k+1)}"/>`;
});
$('stock').innerHTML=st;

const K=[[0,-90,1],[3,163,1],[4.2,163,1],[5.2,163,32],[6.2,100,32],[8.8,798,78],[9.6,798,78],[10.4,798,70],[11.4,700,70],[14.8,-140,1]];
const T=15.6;
function samp(t){
  for(let i=0;i<K.length-1;i++){
    const a=K[i],b=K[i+1];
    if(t<=b[0]){const u=Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]))),e=u*u*(3-2*u);return[a[1]+(b[1]-a[1])*e,a[2]+(b[2]-a[2])*e]}
  }
  const l=K[K.length-1];return[l[1],l[2]];
}
let cam=0,mx=0,mxs=0,prev=0,clock=0,last=performance.now();
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1});

function draw(t,dt,snap){
  const [xf,h]=samp(t);
  const tgt=Math.max(0,Math.min(520,xf-330));
  cam=snap?tgt:cam+(tgt-cam)*(1-Math.exp(-dt*4));
  mxs+=(mx-mxs)*(1-Math.exp(-dt*5));
  let px=300,pb=0;
  if(t>=4.2&&t<9.6){px=xf+137;pb=Math.max(0,h-1)}
  else if(t>=9.6){px=935;pb=Math.max(70,h-1)}
  $('fk').setAttribute('transform',`translate(${xf},0)`);
  $('car').setAttribute('transform',`translate(0,${-h})`);
  $('pallet').setAttribute('transform',`translate(${px},${-pb})`);
  $('wf').setAttribute('transform',`rotate(${xf/26*57.3})`);
  $('wr').setAttribute('transform',`rotate(${xf/22*57.3})`);
  $('far').setAttribute('transform',`translate(${-cam*.25-mxs*8},0)`);
  $('mid').setAttribute('transform',`translate(${-cam*.55-mxs*18},0)`);
  $('world').setAttribute('transform',`translate(${-cam},0)`);
  $('scene').style.opacity=t<.6?t/.6:t>T-.8?(T-t)/.8:1;
}

if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  draw(9.2,0,true);
}else{
  let snap=true;
  (function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
    const t=clock%T;
    if(t<prev)snap=true;
    prev=t;
    draw(t,dt,snap);snap=false;
    requestAnimationFrame(frame);
  })(performance.now());
}
</script>
</body>
</html>
