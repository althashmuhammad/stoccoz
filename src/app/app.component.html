<app-navbar [activePage]="activePage()" (navigatePage)="onNavigate($event)"></app-navbar>

@if (activePage() === 'demo') {
  <main class="demo-main-wrapper">
    <app-book-demo-page></app-book-demo-page>
  </main>
} @else if (activePage() === 'about') {
  <main class="about-main-wrapper">
    <app-about-page></app-about-page>
  </main>
} @else if (activePage() === 'pricing') {
  <main class="pricing-main-wrapper">
    <app-pricing
      (navigateAbout)="onNavigate('about')"
      (navigateDemo)="onNavigate('demo')"
    ></app-pricing>
  </main>
} @else if (activePage() === 'explore-warehouse') {
  <main class="explore-warehouse-wrapper">
    <app-warehouse-explore
      (navigateAbout)="onNavigate('about')"
      (navigateDemo)="onNavigate('demo')"
      (navigateHome)="onNavigate('home')"
      (navigatePricing)="onNavigate('pricing')"
    ></app-warehouse-explore>
  </main>
} @else if (activePage() === 'explore-vans') {
  <main class="explore-vans-wrapper">
    <app-vans-explore
      (navigateAbout)="onNavigate('about')"
      (navigateDemo)="onNavigate('demo')"
      (navigateHome)="onNavigate('home')"
      (navigatePricing)="onNavigate('pricing')"
      (navigateWarehouse)="onNavigate('explore-warehouse')"
    ></app-vans-explore>
  </main>
} @else if (activePage() === 'explore-3pl') {
  <main class="explore-3pl-wrapper">
    <app-three-pl-explore
      (navigateAbout)="onNavigate('about')"
      (navigateDemo)="onNavigate('demo')"
      (navigateHome)="onNavigate('home')"
      (navigatePricing)="onNavigate('pricing')"
      (navigateWarehouse)="onNavigate('explore-warehouse')"
      (navigateVans)="onNavigate('explore-vans')"
    ></app-three-pl-explore>
  </main>
} @else {
  <main #mainRef>
    <app-hero
      (navigateAbout)="onNavigate('about')"
      (navigateDemo)="onNavigate('demo')"
    ></app-hero>
    <app-warehouse-intro (navigateExplore)="onNavigate('explore-warehouse')"></app-warehouse-intro>
    <app-warehouse-capabilities></app-warehouse-capabilities>
    <app-vansales-transition></app-vansales-transition>
    <app-connected-operations></app-connected-operations>
    <app-clients></app-clients>
  </main>
}

<app-footer
  (navigateAbout)="onNavigate('about')"
  (navigateDemo)="onNavigate('demo')"
  (navigatePricing)="onNavigate('pricing')"
  (navigateHome)="onNavigate('home')"
></app-footer>
