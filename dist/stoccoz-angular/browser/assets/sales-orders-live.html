<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sales Orders Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: white page, one card floating in 3D. Scene (perspective) > tilt (auto sway) > card. Title, button, column heads, list and footer sit on different depth layers; the order list streams new rows in a fast scroll. */
:root{
  --bg:transparent;
  --card:#FFFFFF;
  --pop:#FFFFFF;
  --ink:#161C34;
  --muted:#7F86A0;
  --line:#EDEFF5;
  --edge:rgba(22,28,52,.07);
  --shadow:rgba(30,40,100,.26);
  --amber:#F6B400;
  --amber-ink:#1B1400;
  --amber-soft:#FDEFC6;
  --navy:#0A1128;
  --green:#12A150;
  --c-confirmed:#2F6BEB;
  --c-pending:#C98200;
  --c-delivered:#16995E;
  --c-cancelled:#D8434B;
  --slab1:#E8EBF3;
  --slab2:#D3D8E6;
  --spring:cubic-bezier(.2,.9,.3,1.4);
  --ease:cubic-bezier(.2,.9,.3,1);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:transparent!important;color:var(--ink);font-size:13px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow:hidden!important;margin:0;padding:0;scrollbar-width:none!important;-ms-overflow-style:none!important}
html{background:transparent!important;overflow:hidden!important;scrollbar-width:none!important}
::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

.wrap{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;
  padding:4px;
  height:100vh;
  box-sizing:border-box;
  background:transparent!important;
}

/* ---------- 3D rig ---------- */
.scene{width:min(340px,96%);perspective:1300px;animation:sceneIn .8s ease backwards;transform-origin:center center}
@keyframes sceneIn{from{opacity:0}}
.tilt{transform-style:preserve-3d;will-change:transform}
.card{
  position:relative;transform-style:preserve-3d;background:var(--card);border-radius:22px;padding-bottom:10px;
  box-shadow:0 24px 60px -28px var(--shadow),0 0 0 1px var(--edge);
}
.card::before,.card::after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none}
.card::before{background:var(--slab1);transform:translateZ(-8px)}
.card::after{background:var(--slab2);transform:translateZ(-16px)}
.head,.foot{transform-style:preserve-3d}
.foot{
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 8px 18px 6px !important;
  border-top: 1px solid var(--line) !important;
  margin-top: 4px !important;
  background: #fafbfe !important;
  border-radius: 0 0 20px 20px !important;
}
.fk{
  font-size: 10px !important;
  font-weight: 600 !important;
  color: var(--muted) !important;
  text-transform: uppercase !important;
  letter-spacing: 0.04em !important;
  margin-right: 6px !important;
}
.fv{
  font-size: 11.5px !important;
  font-weight: 700 !important;
  color: var(--ink) !important;
  font-family: 'DM Mono', monospace !important;
}
.z{transform:translateZ(var(--z,0px))}
.z>*{animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--i,0)*80ms + .5s)}
@keyframes rise{from{opacity:0;translate:0 14px}}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 12px}
.head h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.015em}
.create{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  padding:8px 14px;border-radius:10px;background:var(--amber);color:var(--amber-ink);font-size:12px;font-weight:700;line-height:1;
  box-shadow:0 6px 14px -6px rgba(246,180,0,.75);
  transition:transform .22s var(--spring),box-shadow .22s,opacity .2s}
.create .pl{display:inline-block;font-size:15px;line-height:.8;font-weight:600;transition:transform .35s var(--spring)}
.create:is(:hover,.hov){transform:translateY(-2px) scale(1.05);box-shadow:0 12px 20px -8px rgba(246,180,0,.9)}
.create:is(:hover,.hov) .pl{transform:rotate(90deg)}
.create:is(:active,.prs){transform:scale(.95)}
.create:disabled{opacity:.5;pointer-events:none}

.cols,.row{--cols:minmax(0,1.9fr) minmax(0,.85fr) minmax(0,1fr) minmax(0,1fr);grid-template-columns:var(--cols)}
.cols{display:grid;gap:6px;padding:0 22px 8px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:500;letter-spacing:.02em;color:var(--muted)}
.cols span:first-child{padding-left:36px}

.listwrap{position:relative}
.list{
  height:115px;overflow-x:hidden;overflow-y:auto;padding:4px 8px;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 8px,#000 calc(100% - 16px),transparent 100%);
}
.list::-webkit-scrollbar{display:none}
#rows{list-style:none;margin:0;padding:0}
.card.speeding .list{pointer-events:none}

.row{
  position:relative;display:grid;gap:6px;align-items:center;height:38px;padding:0 12px;border-radius:12px;
  font-size:11px;font-weight:500;
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .34s cubic-bezier(.2,.9,.3,1.25),box-shadow .3s,background-color .25s;
}
.row::before{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;background:var(--line);transition:opacity .2s}
.row::after{content:"";position:absolute;left:16px;right:16px;bottom:8px;height:3px;border-radius:3px;background:var(--sc);
  transform:scaleX(0);transform-origin:left center;transition:transform .6s var(--ease)}
.row:is(:hover,.hot){
  z-index:3;background:var(--pop);
  box-shadow:0 22px 38px -16px var(--shadow),0 0 0 1px var(--edge);
  transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px) scale(1.04);
}
.row:is(:hover,.hot)::before{opacity:0}
.row:is(:hover,.hot)::after{transform:scaleX(var(--pn))}
.row[data-st="confirmed"]{--sc:var(--c-confirmed);--pn:.55}
.row[data-st="pending"]{--sc:var(--c-pending);--pn:.25}
.row[data-st="delivered"]{--sc:var(--c-delivered);--pn:1}
.row[data-st="cancelled"]{--sc:var(--c-cancelled);--pn:.12}

.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--amber-soft);color:var(--ink);font-size:13px;font-weight:600;
  transition:transform .4s cubic-bezier(.2,1.2,.3,1.5),background-color .25s,box-shadow .3s}
.row:is(:hover,.hot) .av{background:var(--amber);color:var(--amber-ink);transform:rotate(-9deg) scale(1.15);box-shadow:0 8px 14px -6px rgba(246,180,0,.85)}
.nm{position:relative;flex:1;min-width:0;height:36px}
.nm b{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform .32s var(--ease)}
.nm small{position:absolute;left:0;right:0;top:50%;transform:translateY(70%);opacity:0;font-family:'DM Mono',ui-monospace,monospace;font-size:10.5px;color:var(--muted);
  transition:transform .32s var(--ease),opacity .25s}
.row:is(:hover,.hot) .nm b{transform:translateY(-96%)}
.row:is(:hover,.hot) .nm small{transform:translateY(26%);opacity:1}
.it,.am{white-space:nowrap;font-variant-numeric:tabular-nums}
.am{transition:transform .3s var(--spring);transform-origin:left center}
.row:is(:hover,.hot) .am{transform:scale(1.1)}
.st{display:inline-flex;align-items:center;gap:7px;min-width:0;color:var(--sc);font-weight:600;white-space:nowrap}
.st i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--sc)}
.row:is(:hover,.hot) .st i{animation:ping 1.2s ease-out infinite}
@keyframes ping{from{box-shadow:0 0 0 0 currentColor}to{box-shadow:0 0 0 9px transparent}}
.st em{font-style:normal;overflow:hidden;text-overflow:ellipsis}

.row.enter{animation:rowIn .65s var(--ease) backwards;animation-delay:calc(var(--i)*90ms + .8s)}
@keyframes rowIn{from{opacity:0;translate:-26px 0}}
.row.fresh{overflow:hidden;animation:rowNew .55s cubic-bezier(.2,.9,.3,1.2) backwards,flash 1.1s ease-out}
@keyframes rowNew{from{height:0;opacity:0;scale:.9}}
@keyframes flash{0%{background:var(--amber-soft)}100%{background:transparent}}

.rail{display:none!important}
.pills{display:none!important}
.cur{display:none!important}
.pill{appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
  border:1px solid var(--edge);background:#fff;color:var(--ink);font-size:12.5px;font-weight:600;
  box-shadow:0 10px 22px -14px var(--shadow);transition:transform .2s var(--spring),opacity .2s;animation:sceneIn .8s ease 1s backwards}
.pill:hover{transform:translateY(-2px)}
.pill:active{transform:scale(.96)}
.pill:disabled{opacity:.5;pointer-events:none}
.pill i{width:8px;height:8px;border-radius:50%;background:#C5CAD8}
.pill[aria-pressed="true"] i{background:var(--green);animation:blink 1.6s ease-in-out infinite}
.pill svg{color:var(--amber)}
@keyframes blink{50%{opacity:.35}}

@media (max-width:520px){
  .cols,.row{--cols:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr)}
  .cols span:nth-child(2),.row .it{display:none}
  .row{padding:0 10px}
  .row::before,.row::after{left:10px;right:10px}
  .cols{padding-inline:22px}
  .head{padding:20px 18px 14px}
  .foot{margin-inline:18px}
  .fv{font-size:15px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>

<main class="wrap">
  <div class="scene" id="scene">
    <div class="tilt" id="tilt">
      <article class="card" id="card">
        <header class="head">
          <div class="z" style="--z:26px;--i:0"><h1>Sales Orders</h1></div>
          <div class="z" style="--z:40px;--i:1"><button class="create" id="create" type="button"><span class="pl" aria-hidden="true">+</span>Create Order</button></div>
        </header>
        <div class="z" style="--z:14px;--i:2"><div class="cols" aria-hidden="true"><span>Customer</span><span>Items</span><span>Amount</span><span>Status</span></div></div>
        <div class="z" style="--z:6px;--i:3">
          <div class="listwrap">
            <div class="list" id="list" tabindex="0" aria-label="Sales orders list"><ul id="rows"></ul></div>
            <div class="rail" id="rail" aria-hidden="true"><i id="thumb"></i></div>
          </div>
        </div>
        <footer class="foot">
          <div class="z" style="--z:22px;--i:4"><span class="fk">Orders loaded</span><b class="fv" id="kO">4</b></div>
          <div class="z" style="--z:32px;--i:5"><span class="fk">Order value</span><b class="fv" id="kR">₹ 75,210</b></div>
        </footer>
      </article>
    </div>
  </div>

</main>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var tilt=$('#tilt'),card=$('#card'),list=$('#list'),rows=$('#rows'),rail=$('#rail'),thumb=$('#thumb');
var createBtn=$('#create'),speedBtn=$('#speedBtn'),toggle=$('#auto'),toggleTxt=$('#autoTxt');
var kO=$('#kO'),kR=$('#kR'),cur=$('#cur');
var ROW=64,PAD=12,CANCEL={};

/* ---------- data ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rnd=mulberry(20261103);
var NAMES=['Al Huda Store','Fresh Mart','City Supermarket','Raja Traders','Malabar Provisions','Green Leaf Organics','Kerala Spices Co','Sunrise Bakery','Metro Wholesale','Blue Nile Foods','Anand Stores','Lulu Corner Shop','Royal Cash & Carry','Peacock Retail','Nila Fresh Market','Zam Zam Traders','Coastal Mart','Heritage Grocers','Saravana Stores','Golden Harvest','Ocean Pearl Foods','Prime Super Bazaar','Kairali Traders','Daily Needs Hub','Orchid Mart','Mango Tree Stores','Unity Wholesalers','Spice Route Mart','Taj Provision','Jayakrishna Stores','Fortune Foods','Little India Mart','Harbour Fresh','Vega Supermarket','Sree Devi Traders','Noor Kirana','Evergreen Mart','Pearl Cash & Carry','Rainbow Retail','Southern Cross Foods'];
var INITIAL=[
  {id:'SO-4004',name:'Al Huda Store',items:12,amount:24560,status:'Confirmed'},
  {id:'SO-4003',name:'Fresh Mart',items:8,amount:18200,status:'Pending'},
  {id:'SO-4002',name:'City Supermarket',items:15,amount:32450,status:'Delivered'},
  {id:'SO-4001',name:'Raja Traders',items:6,amount:11890,status:'Cancelled'}
];
var nextDown=4000,nextUp=4005,lastName='';
function gen(dir){
  var items=2+Math.floor(rnd()*31),per=850+Math.floor(rnd()*2050),name;
  do{name=NAMES[Math.floor(rnd()*NAMES.length)]}while(name===lastName);
  lastName=name;
  var r=rnd(),status=r<.3?'Confirmed':r<.55?'Pending':r<.9?'Delivered':'Cancelled';
  return {id:'SO-'+(dir<0?nextDown--:nextUp++),name:name,items:items,amount:Math.round(items*per/10)*10,status:status};
}
function money(n){return '₹ '+n.toLocaleString('en-IN')}
function wait(ms){return new Promise(function(r){setTimeout(r,reduce?Math.min(ms,40):ms)})}
function sleep(ms,id){return new Promise(function(res,rej){setTimeout(function(){id!==run?rej(CANCEL):res()},reduce?Math.min(ms,40):ms)})}

function rowEl(o,cls,idx){
  var li=document.createElement('li');
  li.className='row'+(cls?' '+cls:'');
  li.dataset.st=o.status.toLowerCase();
  if(idx!=null)li.style.setProperty('--i',idx);
  li.innerHTML='<div class="who"><span class="av"></span><span class="nm"><b></b><small></small></span></div><span class="it"></span><span class="am"></span><span class="st"><i></i><em></em></span>';
  li.querySelector('.av').textContent=o.name.charAt(0);
  li.querySelector('b').textContent=o.name;
  li.querySelector('small').textContent=o.id;
  li.querySelector('.it').textContent=o.items+' items';
  li.querySelector('.am').textContent=money(o.amount);
  li.querySelector('em').textContent=o.status;
  return li;
}
rows.addEventListener('animationend',function(e){
  if(e.target.classList&&e.target.classList.contains('row')){
    if(e.animationName==='rowIn')e.target.classList.remove('enter');
    if(e.animationName==='flash')e.target.classList.remove('fresh');
  }
});
document.addEventListener('animationend',function(e){if(e.animationName==='cring')cur.classList.remove('clk')});

/* ---------- stats ---------- */
var stat={n:0,rev:0},tgt={o:0,r:0},disp={o:0,r:0},shown={o:-1,r:-1},dirty=false;
function addStat(o){stat.n++;if(o.status!=='Cancelled')stat.rev+=o.amount}
function paintStats(){tgt.o=stat.n;tgt.r=stat.rev;card.classList.toggle('long',stat.n>6)}

/* ---------- list ---------- */
function contentH(){return PAD+rows.childElementCount*ROW}
var railH=0;
function railUpdate(pos){
  if(!railH)railH=rail.clientHeight;
  var ch=contentH(),vh=list.clientHeight,max=Math.max(1,ch-vh);
  var th=Math.max(26,railH*vh/ch);
  thumb.style.height=th.toFixed(1)+'px';
  thumb.style.transform='translateY('+(Math.min(1,pos/max)*(railH-th)).toFixed(1)+'px)';
}
function rebuild(){
  rows.textContent='';
  nextDown=4000;nextUp=4005;stat={n:0,rev:0};
  var frag=document.createDocumentFragment();
  INITIAL.forEach(function(o,i){addStat(o);frag.appendChild(rowEl(o,'enter',i))});
  rows.appendChild(frag);
  list.scrollTop=0;
  paintStats();dirty=false;railUpdate(0);
}
function appendBatch(n){
  var frag=document.createDocumentFragment();
  for(var i=0;i<n;i++){var o=gen(-1);addStat(o);frag.appendChild(rowEl(o))}
  rows.appendChild(frag);
  dirty=true;paintStats();
}
function ensureRows(pos){while(contentH()-(pos+list.clientHeight)<3000)appendBatch(24)}
list.addEventListener('scroll',function(){if(!S&&!tw)railUpdate(list.scrollTop)},{passive:true});

/* ---------- create order ---------- */
var creating=false;
function addNew(){
  if(S||creating)return;
  creating=true;
  var go=function(){
    var o=gen(1);o.status='Pending';addStat(o);
    rows.insertBefore(rowEl(o,'fresh'),rows.firstChild);
    dirty=true;paintStats();railUpdate(0);creating=false;
  };
  if(list.scrollTop>4){
    var done=false,fin=function(){if(done)return;done=true;go()};
    list.addEventListener('scrollend',fin,{once:true});
    setTimeout(fin,900);
    list.scrollTo({top:0,behavior:reduce?'auto':'smooth'});
  }else go();
}
createBtn.addEventListener('click',addNew);

/* ---------- data scroll (fast stream) ---------- */
var S=null,tw=false,vTarget=0,vS=0,speedResolve=null;
var A=1.1,HOLD=2.4,D=1.6,VMAX=2000;
function startSpeed(){
  if(S||tw)return Promise.resolve();
  if(reduce){appendBatch(48);return Promise.resolve()}
  S={t:0,pos:list.scrollTop,vel:0,phase:'run',from:0,to:0,st:0};
  card.classList.add('speeding');
  if(speedBtn)speedBtn.disabled=true;createBtn.disabled=true;
  return new Promise(function(r){speedResolve=r});
}
function finishSpeed(){
  S=null;vTarget=0;
  card.classList.remove('speeding');
  if(speedBtn)speedBtn.disabled=false;createBtn.disabled=false;
  railUpdate(list.scrollTop);
  if(speedResolve){var r=speedResolve;speedResolve=null;r()}
}
function stepSpeed(dt){
  if(!S)return;
  if(S.phase==='run'){
    S.t+=dt;
    var t=S.t,v;
    if(t<A){var u=t/A;v=VMAX*u*u}
    else if(t<A+HOLD){var h=(t-A)/HOLD;v=VMAX*(1+.06*Math.sin(h*Math.PI*4)*Math.sin(h*Math.PI))}
    else if(t<A+HOLD+D){var d=(t-A-HOLD)/D;v=VMAX*(1-d)*(1-d)}
    else{v=0;S.phase='snap';S.from=S.pos;S.to=Math.round(S.pos/ROW)*ROW;S.st=0}
    S.vel=v;S.pos+=v*dt;
    ensureRows(S.pos);
    list.scrollTop=S.pos;
    vTarget=v/VMAX;
    railUpdate(S.pos);
  }else{
    S.st+=dt/.38;
    var k=Math.min(1,S.st),e=1-Math.pow(1-k,3),p=S.from+(S.to-S.from)*e;
    list.scrollTop=p;S.pos=p;vTarget=0;
    railUpdate(p);
    if(k>=1)finishSpeed();
  }
}
function tweenTop(ms){
  return new Promise(function(res){
    if(reduce||list.scrollTop<4){list.scrollTop=0;railUpdate(0);res();return}
    tw=true;card.classList.add('speeding');
    var from=list.scrollTop,t0=performance.now();
    (function f(now){
      var k=Math.min(1,(now-t0)/ms),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      list.scrollTop=from*(1-e);railUpdate(list.scrollTop);
      vTarget=Math.sin(Math.PI*k)*.85;
      if(k<1)requestAnimationFrame(f);
      else{tw=false;vTarget=0;card.classList.remove('speeding');res()}
    })(t0);
  });
}
if(speedBtn)speedBtn.addEventListener('click',function(){stopAuto();startSpeed()});

/* ---------- row tilt on hover ---------- */
list.addEventListener('pointermove',function(e){
  if(S||tw||e.pointerType==='touch')return;
  var r=e.target.closest&&e.target.closest('.row');
  if(!r||r.classList.contains('hot'))return;
  var b=r.getBoundingClientRect();
  r.style.setProperty('--ry',(((e.clientX-b.left)/b.width-.5)*5).toFixed(2)+'deg');
  r.style.setProperty('--rx',((-((e.clientY-b.top)/b.height-.5))*7).toFixed(2)+'deg');
});
list.addEventListener('pointerout',function(e){
  var r=e.target.closest&&e.target.closest('.row');
  if(r&&!r.contains(e.relatedTarget)&&!r.classList.contains('hot')){r.style.removeProperty('--rx');r.style.removeProperty('--ry')}
});
function hotRow(el,on){
  if(!el)return;
  el.classList.toggle('hot',on);
  if(on){el.style.setProperty('--ry','-2.5deg');el.style.setProperty('--rx','2deg')}
  else{el.style.removeProperty('--ry');el.style.removeProperty('--rx')}
}
function clearHot(){[].slice.call(rows.querySelectorAll('.hot')).forEach(function(r){hotRow(r,false)})}

/* ---------- virtual cursor ---------- */
var aim=null,fx=.5,fy=.5,curX=-100,curY=-100,curOn=false;
function setAim(el,x,y){aim=el;fx=x;fy=y}
function curShow(on){curOn=on;if(cur)cur.classList.toggle('on',on)}
function clickFx(){if(cur){cur.classList.remove('clk');void cur.offsetWidth;cur.classList.add('clk')}}
function startCursor(){
  var r=card.getBoundingClientRect();
  curX=r.right-30;curY=r.bottom+60;
  if(cur)cur.style.transform='translate('+curX+'px,'+curY+'px)';
  curShow(true);
}

/* ---------- auto demo ---------- */
var autoOn=false,run=0;
function setAutoUI(on){
  autoOn=on;
  if(toggle)toggle.setAttribute('aria-pressed',on?'true':'false');
  if(toggleTxt)toggleTxt.textContent=on?'Pause auto demo':'Play auto demo';
}
function stopAuto(){
  if(!autoOn)return;
  run++;
  setAutoUI(false);
  curShow(false);aim=null;clearHot();
  createBtn.classList.remove('hov','prs');
}
async function autoLoop(){
  if(autoOn)return;
  autoOn=true;
  var id=++run;
  setAutoUI(true);
  try{
    while(id===run){
      if(!S&&!tw&&(dirty||list.scrollTop>0))rebuild();
      await sleep(500,id);

      /* hover the first three orders */
      for(var i=0;i<3;i++){
        var row=rows.children[i];
        if(row){
          hotRow(row,true);await sleep(850,id);
          hotRow(row,false);await sleep(200,id);
        }
      }

      /* create an order */
      createBtn.classList.add('hov');await sleep(500,id);
      createBtn.classList.add('prs');await sleep(150,id);
      createBtn.classList.remove('prs','hov');
      addNew();
      await sleep(1100,id);
      var fresh=rows.children[0];
      if(fresh){
        hotRow(fresh,true);await sleep(850,id);
        hotRow(fresh,false);
      }

      /* fast data scroll */
      await startSpeed();
      await sleep(500,id);

      /* hover an order from the new data */
      var mid=rows.children[Math.round(list.scrollTop/ROW)+2];
      if(mid){
        hotRow(mid,true);await sleep(1100,id);
        hotRow(mid,false);
      }
      await sleep(400,id);

      /* back to the top, reset */
      await tweenTop(1200);
      await sleep(300,id);
      rebuild();
      await sleep(1800,id);
    }
  }catch(e){if(e!==CANCEL)throw e}
}
if(toggle)toggle.addEventListener('click',function(){
  if(autoOn){stopAuto();return}
  autoLoop();
});
['pointerdown','keydown'].forEach(function(ev){card.addEventListener(ev,function(){
  stopAuto();
  setTimeout(function(){ if(!autoOn) autoLoop(); }, 4000);
},true)});

/* ---------- 3D sway + counters ---------- */
var px=0,py=0,sx=0,sy=0,lastMove=-1e9,intro=0,over=false,lastBlur='',lastGlow=-1;
window.addEventListener('pointermove',function(e){px=(e.clientX/window.innerWidth-.5)*2;py=(e.clientY/window.innerHeight-.5)*2;lastMove=performance.now()},{passive:true});
card.addEventListener('pointerenter',function(){over=true});
card.addEventListener('pointerleave',function(){over=false});
var last=performance.now();
function tick(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  stepSpeed(dt);
  vS+=(vTarget-vS)*Math.min(1,dt*10);
  if(vS<.002&&vTarget===0)vS=0;

  if(!reduce){
    var t=now/1000,tY,tX;
    if(now-lastMove<2500){var a=over?.5:1;tY=px*a;tX=py*a}
    else{tY=Math.sin(t*.6);tX=Math.sin(t*.45+1.2)*.6}
    sx+=(tX-sx)*Math.min(1,dt*3.5);sy+=(tY-sy)*Math.min(1,dt*3.5);
    intro+=(1-intro)*Math.min(1,dt*2.2);
    var k=1-intro;
    var ry=sy*12-k*46,rx=-sx*7+k*22,rz=Math.sin(t*.5)*1,fyy=Math.sin(t*.9)*6,sc=.88+.12*intro;
    tilt.style.transform='translateY('+fyy.toFixed(1)+'px) rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) rotateZ('+rz.toFixed(2)+'deg) scale('+sc.toFixed(3)+')';
  }
  if(curOn&&aim){
    var r=aim.getBoundingClientRect();
    var tx=r.left+r.width*fx,ty=r.top+r.height*fy,e=Math.min(1,dt*7);
    curX+=(tx-curX)*e;curY+=(ty-curY)*e;
    cur.style.transform='translate('+curX.toFixed(1)+'px,'+curY.toFixed(1)+'px)';
  }

  var blur=vS>.02?'blur('+(vS*1.6).toFixed(1)+'px)':'';
  if(blur!==lastBlur){list.style.filter=blur;lastBlur=blur}
  var g=Math.round(vS*40)/40;
  if(g!==lastGlow){
    lastGlow=g;
    card.style.boxShadow='0 34px 76px -34px var(--shadow),0 0 0 1px var(--edge)'+(g>0?',0 0 '+(g*70).toFixed(0)+'px '+(g*6).toFixed(0)+'px rgba(246,180,0,'+(g*.32).toFixed(2)+')':'');
  }

  disp.o+=(tgt.o-disp.o)*Math.min(1,dt*9);
  disp.r+=(tgt.r-disp.r)*Math.min(1,dt*9);
  var o=Math.round(disp.o),rv=Math.round(disp.r/10)*10;
  if(Math.abs(tgt.r-disp.r)<5)rv=tgt.r;
  if(o!==shown.o){shown.o=o;kO.textContent=o.toLocaleString('en-IN')}
  if(rv!==shown.r){shown.r=rv;kR.textContent=money(rv)}
  requestAnimationFrame(tick);
}

/* ---------- boot ---------- */
rebuild();
disp.o=tgt.o;disp.r=tgt.r;
requestAnimationFrame(tick);
if(!reduce)autoLoop();
})();
</script>
