<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Van Silhouette 4-Side Parallax Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-font-smoothing: antialiased;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* Visible, sleek scrollbar so users can also drag the scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f8fafc;
    }
    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 9999px;
    }

    /* 500vh tall scroll track ensures native scrolling works everywhere */
    #scroll-track {
      height: 500vh;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* Fixed viewport stage stays pinned to the screen at all times */
    #fixed-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .gpu {
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      backface-visibility: hidden;
    }

    /* Custom range slider for bottom scrubber */
    input[type="range"].scrubber {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"].scrubber::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.35);
    }
    input[type="range"].scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #000B29;
      border: 2px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
      margin-top: -5px;
      transition: transform 0.15s ease;
    }
    input[type="range"].scrubber::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
  </style>
  <style>
    html, body { height: 100%; min-height: 100%; overflow: hidden; }
    #scroll-track, #control-hud, #start-prompt { display: none !important; }
    #fixed-stage { justify-content: center; padding-left: 0; position: absolute; }
  </style>
</head>
<body>

  <!-- NATIVE SCROLL RUNWAY (500vh) -->
  <div id="scroll-track" aria-hidden="true"></div>

  <!-- FIXED VISUAL STAGE -->
  <div id="fixed-stage">

    <!-- =====================================================================
         4-SIDE FLOATING DARK NAVY BLUE (#000B29) BACKGROUND PANELS
         Float in from Top, Bottom, Left, Right -> Fill Screen -> Reverse Out
         ===================================================================== -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none z-10">
      <!-- Subtle Secondary Parallax Floating Waves from all 4 sides -->
      <div
        id="wave-top"
        class="gpu absolute -top-[12%] -left-[10%] w-[120%] h-[68%] bg-[#05184d] rounded-b-[120px] opacity-0"
        style="transform: translate3d(0, -115%, 0);"
      ></div>
      <div
        id="wave-bottom"
        class="gpu absolute -bottom-[12%] -left-[10%] w-[120%] h-[68%] bg-[#05184d] rounded-t-[120px] opacity-0"
        style="transform: translate3d(0, 115%, 0);"
      ></div>
      <div
        id="wave-left"
        class="gpu absolute -top-[10%] -left-[12%] w-[68%] h-[120%] bg-[#05184d] rounded-r-[120px] opacity-0"
        style="transform: translate3d(-115%, 0, 0);"
      ></div>
      <div
        id="wave-right"
        class="gpu absolute -top-[10%] -right-[12%] w-[68%] h-[120%] bg-[#05184d] rounded-l-[120px] opacity-0"
        style="transform: translate3d(115%, 0, 0);"
      ></div>

      <!-- Primary 4-Side Dark Navy (#000B29) Floating Panels -->
      <div
        id="panel-top"
        class="gpu absolute top-0 left-0 w-full h-[56%] bg-[#000B29] rounded-b-[48px]"
        style="transform: translate3d(0, -112%, 0);"
      ></div>
      <div
        id="panel-bottom"
        class="gpu absolute bottom-0 left-0 w-full h-[56%] bg-[#000B29] rounded-t-[48px]"
        style="transform: translate3d(0, 112%, 0);"
      ></div>
      <div
        id="panel-left"
        class="gpu absolute top-0 left-0 w-[56%] h-full bg-[#000B29] rounded-r-[48px]"
        style="transform: translate3d(-112%, 0, 0);"
      ></div>
      <div
        id="panel-right"
        class="gpu absolute top-0 right-0 w-[56%] h-full bg-[#000B29] rounded-l-[48px]"
        style="transform: translate3d(112%, 0, 0);"
      ></div>

      <!-- Center Seamless Lock Layer (Guarantees solid #000B29 in Hold Stage) -->
      <div
        id="bg-solid-lock"
        class="gpu absolute inset-0 bg-[#000B29] opacity-0"
      ></div>
    </div>

    <!-- =====================================================================
         CENTERED WHITE VAN SILHOUETTE (Exact shape from image_8aa387.png
         and proportions from image_8a97e1.jpg)
         ===================================================================== -->
    <div
      id="van-wrapper"
      class="gpu relative z-20 w-[64vw] max-w-[640px] min-w-[260px] aspect-[1200/530] flex items-center justify-center select-none pointer-events-none"
    >
      <svg
        viewBox="0 0 1200 530"
        class="w-full h-full overflow-visible"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <!-- Exact Van Outer Silhouette ClipPath from image_8aa387.png -->
          <clipPath id="van-silhouette-clip">
            <path d="M 160,40 L 680,40 C 760,40 830,65 900,115 L 1030,210 C 1050,225 1075,235 1095,250 C 1115,265 1125,290 1125,320 L 1125,405 C 1125,440 1098,465 1065,465 L 958,465 A 65,65 0 0 1 828,465 L 365,465 A 65,65 0 0 1 235,465 L 160,465 C 120,465 90,435 90,395 L 90,110 C 90,70 120,40 160,40 Z" />
          </clipPath>
        </defs>

        <!-- Faint Silhouette Guide Stroke during transition so user sees the van boundary forming -->
        <path
          id="van-guide-stroke"
          d="M 160,40 L 680,40 C 760,40 830,65 900,115 L 1030,210 C 1050,225 1075,235 1095,250 C 1115,265 1125,290 1125,320 L 1125,405 C 1125,440 1098,465 1065,465 L 958,465 A 65,65 0 0 1 828,465 L 365,465 A 65,65 0 0 1 235,465 L 160,465 C 120,465 90,435 90,395 L 90,110 C 90,70 120,40 160,40 Z"
          fill="none"
          stroke="rgba(255,255,255,0.22)"
          stroke-width="3"
          opacity="0"
        />

        <!-- Clipped Interior: Staggered White Cards float in to fill the Van Silhouette -->
        <g clip-path="url(#van-silhouette-clip)">
          <!-- Soft translucent fill while cards assemble -->
          <rect
            id="van-underlay"
            x="80"
            y="30"
            width="1060"
            height="505"
            fill="#ffffff"
            opacity="0"
          />

          <!-- 8 White Floating Cards that assemble inside the van and lock into pure white -->
          <!-- Card 0: Rear Upper Bay (enters from Left-Top) -->
          <g class="van-card" data-index="0">
            <rect x="85" y="35" width="275" height="220" rx="22" fill="#ffffff" />
            <rect x="115" y="68" width="120" height="12" rx="6" fill="#cbd5e1" class="card-detail" />
            <rect x="115" y="92" width="180" height="10" rx="5" fill="#e2e8f0" class="card-detail" />
          </g>

          <!-- Card 1: Mid Upper Roof (enters from Top) -->
          <g class="van-card" data-index="1">
            <rect x="355" y="35" width="275" height="220" rx="22" fill="#ffffff" />
            <rect x="385" y="68" width="130" height="12" rx="6" fill="#cbd5e1" class="card-detail" />
            <rect x="385" y="92" width="175" height="10" rx="5" fill="#e2e8f0" class="card-detail" />
          </g>

          <!-- Card 2: Front Upper Cab (enters from Right-Top) -->
          <g class="van-card" data-index="2">
            <rect x="625" y="35" width="505" height="220" rx="22" fill="#ffffff" />
            <rect x="650" y="68" width="95" height="12" rx="6" fill="#cbd5e1" class="card-detail" />
          </g>

          <!-- Card 3: Rear Lower Cargo & Wheel Well (enters from Left-Bottom) -->
          <g class="van-card" data-index="3">
            <rect x="85" y="250" width="275" height="285" rx="22" fill="#ffffff" />
            <rect x="115" y="285" width="140" height="12" rx="6" fill="#cbd5e1" class="card-detail" />
            <rect x="115" y="310" width="190" height="10" rx="5" fill="#e2e8f0" class="card-detail" />
          </g>

          <!-- Card 4: Center Lower Deck (enters from Bottom) -->
          <g class="van-card" data-index="4">
            <rect x="355" y="250" width="275" height="285" rx="22" fill="#ffffff" />
            <rect x="385" y="285" width="135" height="12" rx="6" fill="#cbd5e1" class="card-detail" />
            <rect x="385" y="310" width="180" height="10" rx="5" fill="#e2e8f0" class="card-detail" />
          </g>

          <!-- Card 5: Cab Lower Door & Front Wheel Well (enters from Bottom-Right) -->
          <g class="van-card" data-index="5">
            <rect x="625" y="250" width="315" height="285" rx="22" fill="#ffffff" />
            <rect x="655" y="285" width="140" height="12" rx="6" fill="#cbd5e1" class="card-detail" />
            <rect x="655" y="310" width="190" height="10" rx="5" fill="#e2e8f0" class="card-detail" />
          </g>

          <!-- Card 6: Front Bumper & Hood Nose (enters from Far Right) -->
          <g class="van-card" data-index="6">
            <rect x="935" y="220" width="200" height="310" rx="22" fill="#ffffff" />
            <rect x="960" y="285" width="110" height="12" rx="6" fill="#cbd5e1" class="card-detail" />
          </g>

          <!-- Pure White Seamless Lock Layer (Ensures 100% solid white van in Hold Stage) -->
          <path
            id="van-solid-white"
            d="M 160,40 L 680,40 C 760,40 830,65 900,115 L 1030,210 C 1050,225 1075,235 1095,250 C 1115,265 1125,290 1125,320 L 1125,405 C 1125,440 1098,465 1065,465 L 958,465 A 65,65 0 0 1 828,465 L 365,465 A 65,65 0 0 1 235,465 L 160,465 C 120,465 90,435 90,395 L 90,110 C 90,70 120,40 160,40 Z"
            fill="#ffffff"
            opacity="0"
          />
        </g>

        <!-- Exact Front Cabin Window Cutout in Dark Navy (#000B29) -->
        <path
          id="van-window-cutout"
          d="M 775,130 C 775,108 792,95 815,95 C 830,95 848,103 865,116 L 978,200 C 998,215 992,240 966,240 L 805,240 C 788,240 775,227 775,210 Z"
          fill="#000B29"
          opacity="0"
        />
      </svg>
    </div>

    <!-- =====================================================================
         STAGE 1 SCROLL PROMPT (Visible on initial white screen so it never
         looks broken or stuck, fades out smoothly as soon as scroll starts)
         ===================================================================== -->
    <div
      id="start-prompt"
      class="fixed inset-x-0 bottom-20 z-30 flex flex-col items-center justify-center gap-2.5 transition-opacity duration-300 pointer-events-none"
    >
      <div class="w-6 h-10 rounded-full border-2 border-[#000B29]/30 flex items-start justify-center p-1.5 bg-white/80 backdrop-blur-sm shadow-sm">
        <div class="w-1.5 h-2.5 rounded-full bg-[#000B29] animate-bounce"></div>
      </div>
      <span class="text-[11px] font-semibold tracking-[0.22em] uppercase text-[#000B29]/60">
        Scroll Down or Click Play
      </span>
    </div>

  </div>

  <!-- =====================================================================
       MINIMAL INTERACTIVE HUD (Bottom Control Pill: Play/Pause + Scrubber
       so user can test/verify the 3-stage flow even without scrolling)
       ===================================================================== -->
  <div
    id="control-hud"
    class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-4 py-2 rounded-full bg-white/90 backdrop-blur-md border border-slate-200/90 shadow-lg text-xs text-slate-700 select-none"
  >
    <button
      id="btn-autoplay"
      type="button"
      class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#000B29] text-white font-medium hover:bg-[#05184d] active:scale-95 transition"
    >
      <span id="play-icon">▶</span>
      <span id="play-label">Auto-Play</span>
    </button>

    <div class="flex items-center gap-2">
      <span class="text-[10px] font-mono uppercase tracking-wider text-slate-400">White</span>
      <input
        id="progress-scrubber"
        type="range"
        min="0"
        max="1000"
        value="0"
        class="scrubber w-28 sm:w-40"
        aria-label="Animation Progress"
      />
      <span class="text-[10px] font-mono uppercase tracking-wider text-slate-400">White</span>
    </div>

    <span id="stage-badge" class="hidden sm:inline-block text-[10px] font-mono font-semibold text-[#000B29] min-w-[92px] text-right">
      1. White BG
    </span>
  </div>

  <script>
    (function () {
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
      const lerp = (a, b, t) => a + (b - a) * t;

      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
      const easeInOutCubic = (t) =>
        t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      // DOM Elements
      const panelTop = document.getElementById('panel-top');
      const panelBottom = document.getElementById('panel-bottom');
      const panelLeft = document.getElementById('panel-left');
      const panelRight = document.getElementById('panel-right');
      const bgSolidLock = document.getElementById('bg-solid-lock');

      const waveTop = document.getElementById('wave-top');
      const waveBottom = document.getElementById('wave-bottom');
      const waveLeft = document.getElementById('wave-left');
      const waveRight = document.getElementById('wave-right');

      const vanWrapper = document.getElementById('van-wrapper');
      const vanGuideStroke = document.getElementById('van-guide-stroke');
      const vanUnderlay = document.getElementById('van-underlay');
      const vanSolidWhite = document.getElementById('van-solid-white');
      const vanWindowCutout = document.getElementById('van-window-cutout');

      const startPrompt = document.getElementById('start-prompt');
      const btnAutoplay = document.getElementById('btn-autoplay');
      const playIcon = document.getElementById('play-icon');
      const playLabel = document.getElementById('play-label');
      const scrubber = document.getElementById('progress-scrubber');
      const stageBadge = document.getElementById('stage-badge');

      const cardNodes = Array.from(document.querySelectorAll('.van-card'));
      const cardDetails = Array.from(document.querySelectorAll('.card-detail'));

      // Multi-directional float vectors for the 7 cards inside the van silhouette
      const cardConfigs = [
        { el: cardNodes[0], dx: -440, dy: -260, rot: -14 }, // 0: Top-Left Rear
        { el: cardNodes[1], dx: 0,    dy: -340, rot: 8   }, // 1: Top-Center Roof
        { el: cardNodes[2], dx: 440,  dy: -260, rot: 12  }, // 2: Top-Right Cab
        { el: cardNodes[3], dx: -460, dy: 290,  rot: 11  }, // 3: Bottom-Left Rear
        { el: cardNodes[4], dx: 0,    dy: 360,  rot: -8  }, // 4: Bottom-Center Floor
        { el: cardNodes[5], dx: 380,  dy: 310,  rot: -10 }, // 5: Bottom-Right Door
        { el: cardNodes[6], dx: 500,  dy: 0,    rot: 9   }  // 6: Front Nose
      ];

      // Unified progress state (0.0 -> 1.0)
      let targetProgress = 0;
      let currentProgress = 0;
      let isAutoPlaying = false;
      let autoPlayDirection = 1;
      let lastScrollY = window.scrollY;

      // The parent Stoccoz page owns scroll. The embedded experience only renders
      // the normalized, reversible progress supplied by its pinned section.
      window.addEventListener('message', (event) => {
        if (!event.data || event.data.type !== 'vansales-progress') return;
        isAutoPlaying = false;
        targetProgress = clamp(Number(event.data.progress) || 0, 0, 1);
      });

      function getMaxScroll() {
        return Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
      }

      function syncWindowScrollToProgress(p) {
        const maxScroll = getMaxScroll();
        window.scrollTo({ top: p * maxScroll, behavior: 'instant' });
        lastScrollY = window.scrollY;
      }

      // 1. Native Window Scroll Listener
      window.addEventListener(
        'scroll',
        () => {
          if (isAutoPlaying) return;
          const maxScroll = getMaxScroll();
          if (Math.abs(window.scrollY - lastScrollY) > 0.5) {
            targetProgress = clamp(window.scrollY / maxScroll, 0, 1);
            lastScrollY = window.scrollY;
          }
        },
        { passive: true }
      );

      // 2. Direct Wheel Fallback (guarantees mouse wheel works even if iframe scroll is locked)
      window.addEventListener(
        'wheel',
        (e) => {
          if (isAutoPlaying) {
            stopAutoPlay();
          }
          const delta = e.deltaY;
          targetProgress = clamp(targetProgress + delta * 0.00045, 0, 1);
          syncWindowScrollToProgress(targetProgress);
        },
        { passive: true }
      );

      // 3. Touch Swipe Fallback for mobile/trackpads
      let touchStartY = 0;
      window.addEventListener(
        'touchstart',
        (e) => {
          if (e.touches.length > 0) {
            touchStartY = e.touches[0].clientY;
          }
        },
        { passive: true }
      );

      window.addEventListener(
        'touchmove',
        (e) => {
          if (e.touches.length > 0) {
            if (isAutoPlaying) stopAutoPlay();
            const currentY = e.touches[0].clientY;
            const dy = touchStartY - currentY;
            touchStartY = currentY;
            targetProgress = clamp(targetProgress + dy * 0.0012, 0, 1);
            syncWindowScrollToProgress(targetProgress);
          }
        },
        { passive: true }
      );

      // 4. Scrubber Input Listener
      scrubber.addEventListener('input', (e) => {
        if (isAutoPlaying) stopAutoPlay();
        targetProgress = clamp( parseFloat(e.target.value) / 1000, 0, 1 );
        syncWindowScrollToProgress(targetProgress);
      });

      // 5. Auto-Play Toggle Button
      function startAutoPlay() {
        isAutoPlaying = true;
        if (targetProgress >= 0.98) {
          targetProgress = 0;
          currentProgress = 0;
        }
        autoPlayDirection = 1;
        playIcon.textContent = '⏸';
        playLabel.textContent = 'Pause';
      }

      function stopAutoPlay() {
        isAutoPlaying = false;
        playIcon.textContent = '▶';
        playLabel.textContent = 'Auto-Play';
      }

      btnAutoplay.addEventListener('click', () => {
        if (isAutoPlaying) {
          stopAutoPlay();
        } else {
          startAutoPlay();
        }
      });

      // Symmetric enter/hold/exit helper
      function calcSymmetric(p, enterStart, enterEnd, exitStart, exitEnd) {
        if (p <= enterStart || p >= exitEnd) return 0;
        if (p >= enterEnd && p <= exitStart) return 1;
        if (p < enterEnd) {
          return easeInOutCubic(invLerp(enterStart, enterEnd, p));
        }
        return 1 - easeInOutCubic(invLerp(exitStart, exitEnd, p));
      }

      function renderFrame() {
        if (isAutoPlaying) {
          targetProgress += 0.0032 * autoPlayDirection;
          if (targetProgress >= 1) {
            targetProgress = 1;
            autoPlayDirection = -1;
          } else if (targetProgress <= 0) {
            targetProgress = 0;
            autoPlayDirection = 1;
          }
        }

        // Smooth interpolation
        currentProgress += (targetProgress - currentProgress) * 0.12;
        if (Math.abs(targetProgress - currentProgress) < 0.0001) {
          currentProgress = targetProgress;
        }

        const p = currentProgress;

        // Update HUD Scrubber & Stage Label
        scrubber.value = Math.round(p * 1000);
        if (p < 0.08) {
          stageBadge.textContent = '1. White BG';
        } else if (p < 0.42) {
          stageBadge.textContent = '2. Float In';
        } else if (p <= 0.58) {
          stageBadge.textContent = '2. Van Hold';
        } else if (p < 0.92) {
          stageBadge.textContent = '3. Reverse Out';
        } else {
          stageBadge.textContent = '3. White BG';
        }

        // Fade out initial scroll prompt once scrolling begins
        startPrompt.style.opacity = p < 0.04 ? '1' : '0';

        // =====================================================================
        // PART A: 4-SIDE DARK NAVY BLUE (#000B29) PANELS
        // Float in from Top, Left, Right, Bottom (p: 0.04 -> 0.30)
        // Float out in exact reverse order (p: 0.70 -> 0.96)
        // =====================================================================
        const topP    = calcSymmetric(p, 0.04, 0.25, 0.86, 0.995);
        const leftP   = calcSymmetric(p, 0.06, 0.27, 0.84, 0.985);
        const rightP  = calcSymmetric(p, 0.08, 0.29, 0.82, 0.975);
        const bottomP = calcSymmetric(p, 0.10, 0.31, 0.80, 0.965);

        panelTop.style.transform    = `translate3d(0, ${lerp(-112, 0, topP)}%, 0)`;
        panelBottom.style.transform = `translate3d(0, ${lerp(112, 0, bottomP)}%, 0)`;
        panelLeft.style.transform   = `translate3d(${lerp(-112, 0, leftP)}%, 0, 0)`;
        panelRight.style.transform  = `translate3d(${lerp(112, 0, rightP)}%, 0, 0)`;

        // Secondary leading parallax waves
        const wTopP    = calcSymmetric(p, 0.02, 0.22, 0.88, 1.0);
        const wLeftP   = calcSymmetric(p, 0.04, 0.24, 0.86, 0.995);
        const wRightP  = calcSymmetric(p, 0.06, 0.26, 0.84, 0.985);
        const wBottomP = calcSymmetric(p, 0.08, 0.28, 0.82, 0.975);

        waveTop.style.transform    = `translate3d(0, ${lerp(-118, 0, wTopP)}%, 0)`;
        waveTop.style.opacity      = Math.sin(wTopP * Math.PI) * 0.6;

        waveBottom.style.transform = `translate3d(0, ${lerp(118, 0, wBottomP)}%, 0)`;
        waveBottom.style.opacity   = Math.sin(wBottomP * Math.PI) * 0.6;

        waveLeft.style.transform   = `translate3d(${lerp(-118, 0, wLeftP)}%, 0, 0)`;
        waveLeft.style.opacity     = Math.sin(wLeftP * Math.PI) * 0.6;

        waveRight.style.transform  = `translate3d(${lerp(118, 0, wRightP)}%, 0, 0)`;
        waveRight.style.opacity    = Math.sin(wRightP * Math.PI) * 0.6;

        // Solid #000B29 background lock when all 4 panels meet in the center
        const bgLockP = calcSymmetric(p, 0.27, 0.32, 0.84, 0.89);
        bgSolidLock.style.opacity = bgLockP;

        // =====================================================================
        // PART B: INTERIOR WHITE CARDS FLOAT IN TO FILL & FORM THE WHITE VAN
        // Enter staggered: 0.16 -> 0.42 (Card 0 -> Card 6)
        // Exit staggered in strict reverse order (LIFO): 0.58 -> 0.84 (Card 6 -> Card 0)
        // =====================================================================
        const totalCards = cardConfigs.length;
        cardConfigs.forEach((cfg, idx) => {
          const enterStart = 0.14 + idx * 0.006;
          const enterEnd   = enterStart + 0.04;

          // Reverse order on scroll after: last card in is first card out
          const revIdx    = (totalCards - 1) - idx;
          const exitStart = 0.84 + revIdx * 0.006;
          const exitEnd   = exitStart + 0.04;

          let cardP = 0;
          if (p <= enterStart || p >= exitEnd) {
            cardP = 0;
          } else if (p >= enterEnd && p <= exitStart) {
            cardP = 1;
          } else if (p < enterEnd) {
            cardP = easeOutCubic(invLerp(enterStart, enterEnd, p));
          } else {
            cardP = 1 - easeInOutCubic(invLerp(exitStart, exitEnd, p));
          }

          const tx = lerp(cfg.dx, 0, cardP);
          const ty = lerp(cfg.dy, 0, cardP);
          const rot = lerp(cfg.rot, 0, cardP);
          const sc = lerp(0.7, 1.0, cardP);

          cfg.el.style.opacity = clamp(cardP * 1.3, 0, 1);
          cfg.el.setAttribute(
            'transform',
            `translate(${tx}, ${ty}) rotate(${rot}, 600, 265) scale(${sc})`
          );
        });

        // Subtle interior card detail bars visible while cards are floating, fading to pure white when locked
        const detailFade = calcSymmetric(p, 0.16, 0.20, 0.84, 0.88);
        cardDetails.forEach((detail) => {
          detail.style.opacity = String(1 - detailFade);
        });

        // Faint guide outline while cards assemble
        const guideP = calcSymmetric(p, 0.11, 0.15, 0.90, 0.94);
        vanGuideStroke.style.opacity = guideP * (1 - detailFade);

        // Soft underlay & Pure White Silhouette Lock in Stage 2 Hold (0.42 -> 0.58)
        const underlayP = calcSymmetric(p, 0.13, 0.18, 0.88, 0.93);
        vanUnderlay.style.opacity = underlayP * 0.2;

        const solidVanP = calcSymmetric(p, 0.18, 0.22, 0.84, 0.88);
        vanSolidWhite.style.opacity = solidVanP;

        // Dark Navy (#000B29) front cabin window cutout
        const windowP = calcSymmetric(p, 0.16, 0.21, 0.85, 0.91);
        vanWindowCutout.style.opacity = windowP;

        // Subtle parallax scale on the van silhouette container
        const vanScaleP = calcSymmetric(p, 0.1, 0.2, 0.86, 0.96);
        const scaleVal = lerp(0.9, 1.0, vanScaleP);
        vanWrapper.style.transform = `translate3d(0, 0, 0) scale(${scaleVal})`;

        requestAnimationFrame(renderFrame);
      }

      requestAnimationFrame(renderFrame);
    })();
  </script>
</body>
</html>
