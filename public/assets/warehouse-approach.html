<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Warehouse Approach</title>
<style>
  /* Layout: full-bleed line-art scene, camera dollies from the yard to the dock entrance */
  :root {
    --paper: #ffffff;
    --navy: #1b2a4e;
    --gold: #f6b800;
    --gold-soft: #fbd978;
    --haze: #eef0f5;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; padding: 0; background: var(--paper); }
  body { overflow: hidden; }
  .stage { position: relative; width: 100%; height: 100%; background: var(--paper); overflow: hidden; }
  svg#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #scene * { vector-effect: non-scaling-stroke; }
  .n { stroke: var(--navy); }
  .g { stroke: var(--gold); }
  .pf { fill: var(--paper); }
  .gf { fill: var(--gold); }
  .veil { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; }
</style>
<div class="stage" role="img" aria-label="Animated line-art warehouse yard with the camera moving toward the loading entrance">
  <svg id="scene" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="shL" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="440" y2="600">
        <stop offset="0" stop-color="#f6b800" stop-opacity="0.6"/>
        <stop offset="1" stop-color="#f6b800" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="shR" gradientUnits="userSpaceOnUse" x1="1672" y1="340" x2="1230" y2="600">
        <stop offset="0" stop-color="#f6b800" stop-opacity="0.6"/>
        <stop offset="1" stop-color="#f6b800" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="glow">
        <stop offset="0" stop-color="#fbd978" stop-opacity="0.55"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <g id="world"></g>
  </svg>
  <div class="veil" id="veil"></div>
</div>
<script>(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var VP = { x: 836, y: 805 };     // vanishing point (image coordinates)
  var GH = 7;                      // ground offset below horizon at facade depth
  var CMAX = 0.75;                 // camera travel: facade ends ~4x larger
  var root = document.getElementById('world');
  var layers = [];

  function el(tag, a, p) {
    var e = document.createElementNS(NS, tag);
    for (var k in a) e.setAttribute(k, a[k]);
    (p || root).appendChild(e);
    return e;
  }
  function ln(p, x1, y1, x2, y2, cls, w, op) {
    var a = { x1: x1, y1: y1, x2: x2, y2: y2, class: cls, 'stroke-width': w || 1.2 };
    if (op) a.opacity = op;
    return el('line', a, p);
  }
  function pl(p, pts, cls, w, op) {
    var a = { points: pts.map(function (q) { return q.join(','); }).join(' '), class: cls, 'stroke-width': w || 1.2 };
    if (op) a.opacity = op;
    return el('polyline', a, p);
  }
  function rc(p, x, y, w, h, cls, sw) {
    return el('rect', { x: x, y: y, width: w, height: h, class: cls, 'stroke-width': sw || 1.2 }, p);
  }
  function layer(z) {
    var g = el('g', {}, root);
    layers.push({ g: g, z: z });
    return g;
  }
  function mirror(x) { return 1672 - x; }

  /* ---------- far atmosphere: light shafts and hairlines (depth 4) ---------- */
  var shafts = layer(4);
  el('polygon', { points: '0,180 470,610 0,420', fill: 'url(#shL)' }, shafts);
  el('polygon', { points: '0,330 400,612 0,540', fill: 'url(#shL)', opacity: 0.8 }, shafts);
  el('polygon', { points: '1672,335 1200,610 1672,470', fill: 'url(#shR)' }, shafts);
  el('polygon', { points: '1672,430 1262,612 1672,560', fill: 'url(#shR)', opacity: 0.8 }, shafts);
  [64, 166, 238, 340, 1330, 1432, 1506, 1608].forEach(function (x) {
    ln(shafts, x, 90, x, 700, 'g', 1, 0.3);
  });

  /* ---------- far side sheds (depth 1.6) ---------- */
  var sheds = layer(1.6);
  [[130, 752, 440, 712], [mirror(130), 752, mirror(440), 712]].forEach(function (s) {
    ln(sheds, s[0], s[1], s[2], s[3], 'g', 2);
    ln(sheds, s[0], s[1] + 6, s[2], s[3] + 6, 'n', 1);
  });
  [292, 1378].forEach(function (x) {
    ln(sheds, x, 688, x, 750, 'g', 2.5);
    pl(sheds, [[x - 11, 688], [x + 11, 688], [x + 7, 684], [x - 7, 684]], 'g', 1.8);
  });

  /* ---------- ground: dynamic cross lines + static lane lines ---------- */
  var ground = el('g', {}, root);
  var gLines = [];
  for (var k = 1; k <= 16; k++) gLines.push(ln(ground, -300, 0, 1972, 0, 'n', 0.9));
  var lanes = el('g', {}, root);
  [[-100, 905], [-100, 941], [1772, 905], [1772, 941], [556, 941], [1118, 941], [300, 1010], [1372, 1010]]
    .forEach(function (e) { ln(lanes, VP.x, VP.y + 6, e[0], e[1], 'g', 2.2, 0.95); });
  [[690, 1010], [980, 1010], [-100, 1010], [1772, 1010], [120, 1010], [1552, 1010]]
    .forEach(function (e) { ln(lanes, VP.x, VP.y + 6, e[0], e[1], 'n', 0.8, 0.28); });

  /* ---------- facade (depth 1.0) ---------- */
  var fa = layer(1.0);
  pl(fa, [[447, 812], [447, 648], [836, 610], [1224, 648], [1224, 812]], 'n pf', 1.3);
  for (var px = 470; px < 1224; px += 24) {
    var top = 610 + Math.abs(px - 836) / 389 * 38 + 14;
    ln(fa, px, top, px, 700, 'n', 0.8, 0.28);
  }
  ln(fa, 447, 703, 640, 703, 'n', 1.2);
  ln(fa, 1028, 703, 1224, 703, 'n', 1.2);
  pl(fa, [[400, 645], [836, 600], [1272, 645]], 'g', 3.6);
  pl(fa, [[430, 656], [836, 611], [1242, 656]], 'g', 1.4, 0.8);
  ln(fa, 836, 600, 836, 690, 'g', 2.6);
  [418, 1253].forEach(function (x) {
    ln(fa, x, 626, x, 812, 'g', 3.2);
    ln(fa, x - 18, 646, x + 18, 646, 'g', 2.4);
    ln(fa, x + 7, 626, x + 7, 812, 'n', 1, 0.7);
  });
  [460, 546, 1058, 1147].forEach(function (x) {
    rc(fa, x, 737, 58, 72, 'g pf', 4);
    rc(fa, x + 8, 746, 42, 63, 'n pf', 1);
    for (var y = 752; y < 808; y += 6) ln(fa, x + 8, y, x + 50, y, 'n', 0.6, 0.5);
  });
  // entrance
  rc(fa, 642, 688, 382, 124, 'pf', 0);
  pl(fa, [[638, 812], [638, 684], [1028, 684], [1028, 812]], 'g', 4.2);
  ln(fa, 640, 693, 1026, 693, 'g', 1.4, 0.85);
  [680, 985].forEach(function (x) {
    ln(fa, x, 696, x, 812, 'n', 1.3);
    ln(fa, x + 8, 696, x + 8, 812, 'n', 0.8, 0.5);
  });

  /* ---------- interior (dynamic planes receding behind the entrance) ---------- */
  var interior = el('g', {}, root);
  var glow = el('circle', { cx: 836, cy: 796, r: 30, fill: 'url(#glow)' }, interior);
  var NP = 12, planes = [];
  for (var j = 0; j < NP; j++) {
    planes.push({
      z: 1.03 * Math.pow(1.19, j),
      path: el('path', { class: 'n', 'stroke-width': 1.2, d: '' }, interior),
      tie: el('line', { class: 'g', 'stroke-width': 1.6 }, interior),
      hang: el('line', { class: 'g', 'stroke-width': 1 }, interior),
      lamp: el('polygon', { class: 'gf g', 'stroke-width': 1, points: '' }, interior)
    });
  }
  var railN = el('path', { class: 'n', 'stroke-width': 0.9, opacity: 0.8, d: '' }, interior);
  var railG = el('path', { class: 'g', 'stroke-width': 1.6, d: '' }, interior);
  var HW = 184, FLOOR = GH, EAVE = -93, APEX = -111, TIE = -80;
  function P(X, Y, Z, c) { var d = Z - c; return [VP.x + X / d, VP.y + Y / d]; }
  function f(p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }

  /* ---------- bollards (depth 0.95) ---------- */
  var bol = layer(0.95);
  [408, 436, 463, 511, 546, 601, 630, 696, 723, 746].forEach(function (x) {
    [x, mirror(x)].forEach(function (xx) {
      rc(bol, xx - 5, 788, 10, 24, 'n gf', 1);
      ln(bol, xx - 5, 794, xx + 5, 794, 'n', 0.8);
    });
  });

  /* ---------- nearer lamps and trees ---------- */
  function lamp(p, x, topY, baseY, w) {
    ln(p, x, topY, x, baseY, 'g', w || 3);
    pl(p, [[x - 17, topY], [x + 17, topY], [x + 9, topY - 5], [x - 9, topY - 5]], 'g', 2);
  }
  var lm = layer(0.98);
  lamp(lm, 198, 653, 815, 3);
  lamp(lm, 1472, 653, 815, 3);
  function tree(p, cx, baseY, h, wd) {
    ln(p, cx, baseY, cx, baseY - h * 0.55, 'g', 2);
    for (var i = 0; i < 9; i++) {
      var a = (i / 8) * Math.PI - Math.PI;
      var ex = cx + Math.cos(a) * wd * (0.5 + 0.5 * ((i * 7) % 5) / 4);
      var ey = baseY - h * 0.55 - Math.abs(Math.sin(a)) * h * 0.45 - ((i * 3) % 4) * 4;
      ln(p, cx, baseY - h * 0.5, ex, ey, 'g', 1, 0.85);
      ln(p, ex, ey, ex + (i % 2 ? 6 : -6), ey - 8, 'g', 0.9, 0.7);
    }
  }
  var treesFar = layer(1.0);
  tree(treesFar, 108, 810, 90, 26);
  tree(treesFar, 1565, 810, 90, 26);
  var treesNear = layer(0.62);
  tree(treesNear, 34, 810, 170, 42);
  tree(treesNear, 1640, 810, 165, 42);
  var lmNear = layer(0.7);
  lamp(lmNear, 80, 588, 815, 3.6);
  lamp(lmNear, 1590, 588, 815, 3.6);

  /* ---------- timeline ---------- */
  function sm(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function cam(t) { return 0.02 * sm(t / 3.5) + (CMAX - 0.02) * sm((t - 3.5) / 4.5); }

  function render(t, wall) {
    var c = cam(t);
    layers.forEach(function (L) {
      var d = L.z - c;
      if (d < 0.1) { L.g.setAttribute('display', 'none'); return; }
      L.g.removeAttribute('display');
      L.g.setAttribute('transform', 'translate(' + VP.x + ' ' + VP.y + ') scale(' + (L.z / d).toFixed(4) + ') translate(' + (-VP.x) + ' ' + (-VP.y) + ')');
    });
    // atmosphere
    shafts.setAttribute('opacity', (0.9 + 0.1 * Math.sin(wall * 0.9)).toFixed(3));
    // ground cross lines
    gLines.forEach(function (l, i) {
      var Z = 0.06 * (i + 1), rel = Z - c;
      var y = VP.y + GH / rel;
      if (rel < 0.05 || y > 1000) { l.setAttribute('display', 'none'); return; }
      var off = y - VP.y;
      var op = Math.max(0, Math.min(0.55, (off - 9) / 55));
      if (op <= 0.01) { l.setAttribute('display', 'none'); return; }
      l.removeAttribute('display');
      l.setAttribute('y1', y.toFixed(1)); l.setAttribute('y2', y.toFixed(1));
      l.setAttribute('opacity', op.toFixed(2));
    });
    // interior
    var rn = '', rg = '';
    var prev = null;
    planes.forEach(function (pn) {
      var d = pn.z - c;
      if (d < 0.1) return;
      var fl = P(-HW, FLOOR, pn.z, c), el_ = P(-HW, EAVE, pn.z, c), ap = P(0, APEX, pn.z, c),
          er = P(HW, EAVE, pn.z, c), fr = P(HW, FLOOR, pn.z, c);
      pn.path.setAttribute('d', 'M' + f(fl) + 'L' + f(el_) + 'L' + f(ap) + 'L' + f(er) + 'L' + f(fr) + 'Z');
      var tl = P(-HW, TIE, pn.z, c), tr = P(HW, TIE, pn.z, c);
      pn.tie.setAttribute('x1', tl[0]); pn.tie.setAttribute('y1', tl[1]);
      pn.tie.setAttribute('x2', tr[0]); pn.tie.setAttribute('y2', tr[1]);
      var h0 = P(0, APEX, pn.z, c), h1 = P(0, -84, pn.z, c);
      pn.hang.setAttribute('x1', h0[0]); pn.hang.setAttribute('y1', h0[1]);
      pn.hang.setAttribute('x2', h1[0]); pn.hang.setAttribute('y2', h1[1]);
      var a1 = P(-6, -84, pn.z, c), a2 = P(6, -84, pn.z, c), a3 = P(0, -70, pn.z, c);
      pn.lamp.setAttribute('points', a1.join(',') + ' ' + a2.join(',') + ' ' + a3.join(','));
      if (prev) {
        rn += 'M' + f(prev.fl) + 'L' + f(fl) + 'M' + f(prev.el) + 'L' + f(el_) + 'M' + f(prev.er) + 'L' + f(er) + 'M' + f(prev.fr) + 'L' + f(fr);
        rg += 'M' + f(prev.ap) + 'L' + f(ap);
      }
      prev = { fl: fl, el: el_, ap: ap, er: er, fr: fr };
    });
    railN.setAttribute('d', rn); railG.setAttribute('d', rg);
    var gz = P(0, -26, 8, c);
    glow.setAttribute('cx', gz[0]); glow.setAttribute('cy', gz[1]);
    glow.setAttribute('r', (70 / (8 - c)).toFixed(1));
  }

  var veil = document.getElementById('veil');
  var reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function setProgress(value) {
    var progress = reducedMotion ? 0 : Math.max(0, Math.min(1, Number(value) || 0));
    var time = progress * 8;
    render(time, time);
    veil.style.opacity = Math.max(0, Math.min(1, (progress - 0.94) / 0.06)).toFixed(3);
  }
  window.addEventListener('message', function (event) {
    if (!event.data || event.data.type !== 'warehouse-progress') return;
    setProgress(event.data.progress);
  });
  render(0, 0);
})();
</script>

</body></html>
